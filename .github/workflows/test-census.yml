name: Test census

# Does this pull request end up with fewer tests than it started with, and if
# so does it say so?
#
# WHY IT IS A SEPARATE WORKFLOW. `verify` is the only required check, and
# whether this becomes one too is an open decision. Putting the census inside
# `verify` would make it required by the back door, which is a decision, not a
# side effect of where a job was pasted.
#
# WHY IT IS CHEAP. It runs no test suite and installs no toolchain: one
# checkout with full history, then a static count of the test sources at two
# commits, straight out of git. Ten seconds against `verify`'s two minutes,
# which is the only reason counting on both sides is affordable at all.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened, edited]

# `edited` is in that list on purpose: the way to resolve a failure here is to
# add a `Removes tests:` line to the pull request body, and a check that did
# not re-run when the body changed would make the fix invisible.

concurrency:
  group: test-census-${{ github.ref }}
  cancel-in-progress: true

jobs:
  census:
    name: census
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Reads the two commits and nothing else. No secrets are in scope here,
    # which is what makes running the branch's own copy of the script
    # acceptable — see the scope job in claude-code-review.yml for the case
    # where it is not.
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Both commits have to be present locally: the script reads each tree
          # with `git ls-tree` rather than checking either one out.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Count the tests on both sides
        env:
          # The body is read for one fixed pattern, never interpolated into a
          # shell command or a prompt. It reaches the script as an environment
          # variable for that reason.
          PR_BODY: ${{ github.event.pull_request.body }}
        # No pipe into `tee`: the default runner shell is `bash -e` without
        # `pipefail`, so a pipeline would report tee's exit code and this job
        # would go green on a failed count — the exact class of defect the
        # check exists to catch. The script writes `$GITHUB_STEP_SUMMARY`
        # itself, so there is nothing to pipe.
        run: |
          node scripts/test-census.mjs \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"

name: verify

on:
  pull_request:
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Checkout is the only step that spends GITHUB_TOKEN, and it only reads.
    # The failure artifact rides the Actions runtime token, not this one.
    permissions:
      contents: read

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is a movable
      # pointer, and whoever owns the action's repository can repoint it at
      # any commit. The trailing comment is the human-readable version, and
      # .github/dependabot.yml opens the PRs that move these forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Which toolchains this product has any app in, from project.json:
      # writes `node=true|false`, `python=false|true` and `e2e=false|true` as
      # step outputs. The uv step runs only for a python app, and the Playwright
      # steps only when some app's verify runs e2e, so a product without
      # browser tests spends no minutes on a browser.
      - id: toolchains
        run: node scripts/project.mjs toolchains >> "$GITHUB_OUTPUT"

      - if: steps.toolchains.outputs.python == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/*/uv.lock'

      - run: npm ci

      # Fails the build rather than resolving new versions silently, so CI
      # tests the same dependency set as a local run.
      # Every Python app project.json declares. Assigned first rather
      # than piped, so a failing lookup stops the step under `bash -e`.
      - if: steps.toolchains.outputs.python == 'true'
        run: |
          apps=$(node scripts/project.mjs apps python)
          for app in $apps; do uv sync --directory "$app" --frozen; done

      - if: steps.toolchains.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      - run: npm run verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.toolchains.outputs.e2e == 'true'
        with:
          name: playwright-report
          path: 'apps/*/playwright-report/'
          retention-days: 7

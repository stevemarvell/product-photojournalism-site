name: verify

# Pull requests only, plus a button. There is deliberately no `push` to
# `develop` trigger: a merge re-ran the verify the pull request had just passed,
# a second ~2.4 billed minutes per merge for the same tree. The cost
# is that nothing mechanical verifies a direct push to `develop`, so "never
# push to develop" is discipline alone. `workflow_dispatch` is how a person
# runs it against a branch by hand. No `edited` trigger either: a body edit
# would start a full verify, and only the census needs those (pr-checks.yml).
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Checkout is the only step that spends GITHUB_TOKEN, and it only reads.
    # The failure artifact rides the Actions runtime token, not this one.
    permissions:
      contents: read

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is a movable
      # pointer, and whoever owns the action's repository can repoint it at
      # any commit. The trailing comment is the human-readable version, and
      # .github/dependabot.yml opens the PRs that move these forward.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # Which toolchains this product has any app in, from project.json:
      # writes `node=true|false`, `python=false|true`, `e2e=false|true` and
      # `postgres=false|true` as
      # step outputs. The uv step runs only for a python app, and the Playwright
      # steps only when some app's verify runs e2e, so a product without
      # browser tests spends no minutes on a browser.
      - id: toolchains
        run: node scripts/project.mjs toolchains >> "$GITHUB_OUTPUT"

      - if: steps.toolchains.outputs.python == 'true'
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: 'apps/*/uv.lock'

      - run: npm ci

      # Fails the build rather than resolving new versions silently, so CI
      # tests the same dependency set as a local run.
      # Every Python app project.json declares. Assigned first rather
      # than piped, so a failing lookup stops the step under `bash -e`.
      - if: steps.toolchains.outputs.python == 'true'
        run: |
          apps=$(node scripts/project.mjs apps python)
          for app in $apps; do uv sync --directory "$app" --frozen; done

      - if: steps.toolchains.outputs.e2e == 'true'
        run: npx playwright install --with-deps chromium

      # Opt-in per app: runs only when some app declares
      # `"services": ["postgres"]` in project.json. A real Postgres, started
      # with docker run rather than a `services:` block, which cannot be made
      # conditional on a step output. The image is pinned by digest, not tag,
      # for the same reason actions are pinned to a SHA. The password is
      # generated here and lives for this job only; it is not a secret.
      # The wait is bounded (30 tries, 1s apart) and fails the step loudly.
      # It probes over TCP (-h), not the default Unix socket: the image's
      # entrypoint first runs a temporary init server that listens on the
      # socket only, then restarts. A socket probe can report ready during
      # init, and verify would hit the restart. Only the real server listens
      # on TCP, so a TCP probe succeeds only once it is up.
      #
      # An app's own tests should FAIL, not skip, when `CI` is set and
      # TEST_DATABASE_URL is missing: a skip is how a green verify has hidden
      # an unexercised adapter. That check belongs in the app's conftest, not
      # in the engine.
      - if: steps.toolchains.outputs.postgres == 'true'
        run: |
          password=$(openssl rand -hex 16)
          docker run -d --name verify-postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD="$password" -e POSTGRES_DB=test \
            postgres@sha256:f9a7b9ebf6f56201f949db745e47bc423c0f0f8294bafe991cc10bf74b029657 # 16.15
          for i in $(seq 1 30); do
            if docker exec verify-postgres pg_isready -h 127.0.0.1 -p 5432 -U postgres -d test; then
              echo "TEST_DATABASE_URL=postgresql://postgres:${password}@localhost:5432/test" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready after 30 tries" >&2
          docker logs verify-postgres >&2
          exit 1

      - run: npm run verify

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() && steps.toolchains.outputs.e2e == 'true'
        with:
          name: playwright-report
          path: 'apps/*/playwright-report/'
          retention-days: 7

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.ref }}
  cancel-in-progress: true

jobs:
  claude:
    # The `contains(..., '@claude')` checks alone would let anyone on the
    # internet trigger this job — this is a public repository. The job's own
    # permissions are read-only and claude-code-action does its own actor
    # check, but this guard means we are not relying solely on those: only a
    # comment or review from an OWNER, MEMBER, or COLLABORATOR is allowed to
    # trigger a run. The three trigger events carry author_association in
    # different places (issue_comment and pull_request_review_comment on
    # `comment`, pull_request_review on `review`), so each branch checks its
    # own field.
    if: |
      (
        github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.review.author_association)
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs

    # Same telemetry wiring as claude-code-review.yml — see the long comment
    # there, and the header of scripts/write-ci-telemetry-settings.mjs for why
    # a settings file loaded with --settings rather than the environment or a
    # project-local file. The only difference is the workflow label, which is
    # what lets the two kinds of unattended run be told apart: a review that
    # happens on every pull request, and a tagged session somebody asked for.
    env:
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${{ secrets.GRAFANA_CLOUD_OTLP_ENDPOINT }}
      GRAFANA_CLOUD_OTLP_AUTH: ${{ secrets.GRAFANA_CLOUD_OTLP_AUTH }}
      CI_TELEMETRY_WORKFLOW: claude-mention

    steps:
      - name: Checkout repository
        # Pinned to a commit SHA rather than the tag — see the comment in
        # verify.yml. It matters most in this job: a repointed tag would run
        # inside a job that has CLAUDE_CODE_OAUTH_TOKEN and the Grafana
        # credentials in its environment.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Point this session's telemetry at Grafana Cloud
        run: node scripts/write-ci-telemetry-settings.mjs

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@d535f5172dec02b204866b393d6b20b9b2aaf98d # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # --settings loads this session's telemetry config — see the env
          # block above and scripts/write-ci-telemetry-settings.mjs's header.
          # Add more flags here to customize behavior and configuration; see
          # https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options.
          claude_args: |
            --settings ${{ runner.temp }}/claude-ci-telemetry-settings.json


name: Contention

# Do two open pull requests collide, and did anybody say so?
#
# GitHub computes mergeability against the base branch and never between two
# pull requests, so two branches touching the same line can both report
# MERGEABLE while only one of them can actually land. Merging the second
# flips the first to CONFLICTING in seconds, with no notification and no
# check re-run. This is the notification.
#
# WHY IT RUNS ON BOTH EVENTS. `pull_request` answers "does this collide with
# anything open right now"; `push` to develop answers "did what just landed
# break anything still open". The second is the one nothing else covers — after
# a merge, no workflow runs on the pull requests that were *not* merged.
#
# WHY IT IS NOT REQUIRED, and not in `verify`. Two colliding pull requests are
# not a defect in either of them; one of them is going to merge and the other
# will rebase. A red check on both would be one neither author can clear alone.
# The script exits 0 whatever it finds, and the signal is the comment, not
# the exit code — this is deliberately advisory rather than required.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [develop]

concurrency:
  # Deliberately not keyed on the ref. Two of these racing would both read the
  # comment list, both find nothing, and both post — the duplicate-comment
  # shape the marker exists to prevent, arriving through timing instead.
  group: contention
  cancel-in-progress: false

jobs:
  contention:
    name: contention
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      # This job writes one comment per pull request and edits its own
      # thereafter, but the scope granting that is not that narrow: GitHub has
      # no comment-only permission, so `pull-requests: write` also permits
      # merging, closing, retitling and labelling *any* open pull request — and
      # it is live while this job runs a script from the pull request's own
      # checkout. `docs/data-governance.md` records that alongside the two
      # credentialed review jobs of the same shape, and what voids the bound
      # they share.
      pull-requests: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge-tree needs the real merge base of every pair, so the whole
          # history has to be here. A shallow clone would make git report
          # unrelated histories, which parseMergeTree reads as "could not run"
          # rather than "clean" on purpose.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: List the open pull requests
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # No `set -e`: an API failure here should leave OPEN_PRS empty and
          # produce a run that finds nothing, not a red job on a pull request
          # that has nothing wrong with it.
          gh pr list --base develop --state open --limit 100 \
            --json number,title,headRefOid > open-prs.json || echo '[]' > open-prs.json
          {
            echo 'json<<PRS_EOF'
            cat open-prs.json
            echo 'PRS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Fetch the heads being compared
        env:
          OPEN_PRS: ${{ steps.open.outputs.json }}
        run: |
          set -uo pipefail
          # The script decides which heads, because MAX_PULL_REQUESTS is its
          # ceiling to declare. Restating the number here is how it would drift.
          # The triggering pull request is passed in because it is reported on
          # whether or not the ceiling would have kept it, so its head has to be
          # here even when the ceiling drops it from the rivals.
          node scripts/pr-contention.mjs --refs ${{ github.event.pull_request.number || '' }} > refs.txt
          if [ -s refs.txt ]; then
            xargs -r git fetch --no-tags origin < refs.txt
          fi

      - name: Say what collides with what
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPEN_PRS: ${{ steps.open.outputs.json }}
          BASE_REF: develop
        # Every open pull request is reported on, whichever event fired.
        # Commenting only on the triggering one would leave a pull request
        # that was already open with no warning at all — a rival opening
        # gives it no event of its own. The quiet ones stay quiet: the script
        # writes nothing for a clean, unchanged verdict.
        #
        # BASE_SHA is resolved here rather than from the event payload: on a
        # pull_request event `base.sha` is the tip as of when the event fired,
        # and the whole point of this check is the merge that landed after it.
        run: |
          set -uo pipefail
          BASE_SHA="$(git rev-parse origin/develop)"
          export BASE_SHA
          node scripts/pr-contention.mjs ${{ github.event.pull_request.number || '' }}

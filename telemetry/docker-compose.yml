# The local telemetry stack. `docker compose up -d` here, then start Claude
# Code in this repository — .claude/settings.json already points it at the
# collector on localhost:4317.
#
# Nothing here is exposed beyond the loopback interface, and no data leaves the
# machine. Credentials come from .env, which is gitignored; .env.example is the
# template.
name: boris-telemetry

services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    command: ['--config=/etc/otel/config.yaml']
    volumes:
      - ./otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - '127.0.0.1:4317:4317'   # OTLP gRPC, what Claude Code talks to
      - '127.0.0.1:4318:4318'   # OTLP HTTP, for anything that cannot do gRPC
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.0.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=90d'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '127.0.0.1:9090:9090'
    depends_on:
      - collector
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    env_file: .env
    environment:
      # One dashboard, one viewer, no sign-up flow to click through.
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

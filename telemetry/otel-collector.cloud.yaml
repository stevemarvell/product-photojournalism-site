# Overlay, not a replacement. The collector accepts --config more than once and
# merges them in order, so this file carries only the delta: one extra exporter
# and two extra pipelines.
#
# Why this exists at all: the GitHub runners cannot reach localhost:4317, so CI
# ships straight to Grafana Cloud. If the laptop kept its metrics purely local
# there would be two stores and no single answer to "what did this cost". This
# sends local telemetry to both — Prometheus for offline history, Grafana Cloud
# so every source lands in one place.
#
# The credential is never committed. It arrives from telemetry/.env, which is
# gitignored, via env substitution below.

processors:
  # check.sh proves the local pipeline by pushing a synthetic payload carrying a
  # deliberately fake identity — canary@example.com — and asserting it does not
  # reach Prometheus as a label. That canary must never leave the machine: the
  # cloud pipelines below no longer scrub, so without this it would arrive in
  # the shared store as a second team member who does not exist, and metric
  # labels are forever. Dropped by service name, which check.sh sets to
  # claude-code-check precisely so it can be told apart from a real session.
  filter/local-only:
    error_mode: ignore
    metrics:
      metric:
        - 'resource.attributes["service.name"] == "claude-code-check"'
    logs:
      log_record:
        - 'resource.attributes["service.name"] == "claude-code-check"'

exporters:
  otlphttp/grafanacloud:
    endpoint: ${env:GRAFANA_CLOUD_OTLP_ENDPOINT}
    headers:
      # Just the value — "Basic <base64>". This differs from the GitHub secret,
      # which holds "Authorization=Basic <base64>", because the OTel SDK parses
      # its header env var as key=value pairs while the collector takes a map
      # with the name already supplied by the key. Same credential, two
      # spellings, and getting them the wrong way round produces a 401 that
      # reads like a bad token.
      Authorization: ${env:GRAFANA_CLOUD_AUTH_HEADER}
    retry_on_failure:
      enabled: true
      # The laptop is not always online. Retry for a while, then drop rather
      # than growing the queue without bound.
      max_elapsed_time: 300s

service:
  pipelines:
    # Separate pipelines rather than extra exporters on the existing ones, and
    # the difference is the whole point of this file.
    #
    # The local pipelines scrub identity, because a single-developer Prometheus
    # does not need to know who the developer is and metric labels are forever.
    # Applying that same scrub to the cloud export was actively wrong: every
    # other Claude Code session on this machine reports to Grafana Cloud
    # directly from ~/.claude/settings.json, carrying user.email, and so does
    # every GitHub Actions run. Stripping it from this one source did not
    # protect anything — the store already holds that address — it just split
    # one person into two. Observed, not predicted: with the scrub applied,
    # "Cost by team member" read `Value $0.57` next to
    # `steve@stevemarvell.com $0.49`, and "Active users" said 2 for one human.
    #
    # So: scrubbed on the way to disk here, intact on the way to the store that
    # has it anyway. The identity decision now follows the destination rather
    # than the source, which is the only way the aggregate can be correct.
    metrics/cloud:
      receivers: [otlp]
      processors: [filter/local-only, batch]
      exporters: [otlphttp/grafanacloud]
    logs/cloud:
      receivers: [otlp]
      # Events, which the Claude Code integration's dashboards read. The base
      # config sends these to `nop`; that pipeline stays, so locally they are
      # still discarded. What is never set anywhere is OTEL_LOG_USER_PROMPTS,
      # OTEL_LOG_TOOL_DETAILS and OTEL_LOG_TOOL_CONTENT — those are what would
      # turn an event from "which tool ran, how long, which model" into the
      # prompt and the file contents. That is the redaction; the pipe is not.
      processors: [filter/local-only, batch]
      exporters: [otlphttp/grafanacloud]
